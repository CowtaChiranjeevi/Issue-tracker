
services:
  postgres:
    image: postgres:16-alpine
    container_name: tracker_postgres
    environment:
      POSTGRES_DB: issuetracker
      POSTGRES_USER: tracker_admin
      POSTGRES_PASSWORD: tracker_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: